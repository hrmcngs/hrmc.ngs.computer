name: Guarded Bot auto-merge
on:
  workflow_dispatch:
    inputs:
      number:
        description: 人間がレビュー済みのBot PR番号
        required: true
        type: string
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [Bot checks]
    types: [completed]
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions: {}
jobs:
  guarded-auto-merge:
    if: github.event_name != 'pull_request_review' || github.event.review.state != 'commented'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      actions: read
    steps:
      # Always load trusted default-branch code. No PR checkout, artifacts, caches or install scripts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check human approval and CI before requesting native auto-merge
        run: node .github/ai-bot/src/auto-merge.js
        env:
          GH_TOKEN: ${{ github.token }}
