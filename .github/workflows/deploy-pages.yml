name: Deploy to GitHub Pages

# GitHub Pages のデプロイをカスタムワークフロー化。
# charts/ の更新では push トリガーで再ビルドしない（更新のたびに巻き込まないように）。
# ただしそれだけだとサイトが配信する charts/downloads.json が永久に古いままになるため、
# チャートに変化があったときは update-charts.yml から workflow_call で明示的に呼ぶ。
#
# 補足: bot の push は GITHUB_TOKEN で行われるため、そもそも push トリガーでは
# ワークフローが起動しない（再帰防止の仕様）。paths-ignore の有無に関係なく、
# charts 更新後のデプロイは呼び出し側から明示的に行う必要がある。

on:
  push:
    branches: [main]
    paths-ignore:
      - 'charts/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Commit containing the generated chart and star data
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のビルドをキャンセルせずキューに積む（push が重なってもキャンセルされない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Generate photo catalog
        run: sbcl --script scripts/photo-catalog.lisp

      - name: Generate searchable profiles
        run: sbcl --script scripts/build-seo.lisp

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
