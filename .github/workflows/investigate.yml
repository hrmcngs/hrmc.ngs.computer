name: AI investigation
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        description: 実行内容（update-onlyはBot更新のみ・AI APIとAIキー不要）
        type: choice
        options: [investigate, update-only]
        default: investigate
      check_bot_updates:
        description: Bot本体の更新PRも確認する（追加トークン不要・Actions定義は手動更新）
        type: boolean
        default: true
      ai:
        description: AIを選択（allは登録済みAIの案を統合・利用回数が増えます）
        type: choice
        options: [default, tokyo, claude, codex, all]
        default: default
      reference_previous:
        description: 旧PRの差分を参照するか（defaultは設定に従う）
        type: choice
        options: [default, 'on', 'off']
        default: default
      target:
        description: 調査する対象
        type: choice
        options: [all, issue, dependabot]
        default: all
        required: true
      result:
        description: 結果の出力方法（report-prはIssueのみ）
        type: choice
        options: [comment, report-pr]
        default: comment
      number:
        description: 番号（空欄で選択した対象すべて・APIキーを入力しない）
        type: string
        required: false
  issues:
    types: [labeled]
  schedule:
    - cron: '23 * * * *'
permissions: {}
jobs:
  bot-updates:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'update-only' || inputs.check_bot_updates)
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/bot-updates.yml
    with:
      scope: runtime
  select:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.operation != 'update-only') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request && github.event.comment.user.type == 'User' &&
      (contains(github.event.comment.body, '/ai-investigate') || contains(github.event.comment.body, '/ai-report-pr'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      vulnerability-alerts: read
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: select
        run: node .github/ai-bot/src/bulk.js scan-investigate
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PRIVATE_REPOSITORY: ${{ vars.AI_BOT_ALLOW_PRIVATE }}
  run:
    concurrency:
      group: ai-investigate-${{ github.repository }}-${{ matrix.kind }}-${{ matrix.number }}
      cancel-in-progress: false
    needs: select
    if: needs.select.outputs.ready == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      vulnerability-alerts: read
    uses: ./.github/workflows/investigate-one.yml
    with:
      ai: ${{ inputs.ai || 'default' }}
      number: ${{ matrix.number }}
      target: ${{ matrix.kind }}
      result: ${{ inputs.result || 'comment' }}
      reference_previous: ${{ inputs.reference_previous || 'default' }}
    secrets:
      TOKYO_AI_API_KEY: ${{ secrets.TOKYO_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
