<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 60">
  <style>
    .open{animation:eye-open 5.2s step-end infinite}
    .closed{visibility:hidden;animation:eye-closed 5.2s step-end infinite}
    @keyframes eye-open{0%,47%,80%{visibility:visible}44%,77%{visibility:hidden}}
    @keyframes eye-closed{0%,47%,80%{visibility:hidden}44%,77%{visibility:visible}}
    @media (prefers-reduced-motion:reduce){.open,.closed{animation:none}}
  </style>
  <rect width="84" height="60" rx="18" fill="#fff"/>
  <!-- One pixel is a 3 × 3 unit square; blinking switches whole pixel frames. -->
  <g transform="scale(3)" shape-rendering="crispEdges">
    <g class="open">
      <!-- Stepped lashes and eye outline. -->
      <path fill="#111" d="M5 3h1v2h1v2H6V5H5ZM8 1h1v3h1v2H9V4H8ZM11 0h1v5h-1ZM14 0h1v5h-1ZM18 1h1v3h-1v2h-1V4h1ZM22 2h1v2h-1v2h-1v1h-1V5h1V4h1ZM25 4h1v2h-1v2h-1v1h-1V7h1V6h1Z"/>
      <path fill="#111" d="M11 4h6v1h3v1h2v1h2v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-2v1h-2v1h-3v1h-6v-1H8v-1H6v-1H4v-1H3v-1H2v-1H1v-1h1V9h1V8h1V7h2V6h2V5h3Z"/>
      <path fill="#fff" d="M11 5h6v1h3v1h2v1h2v1h1v1h1v1h-1v1h-1v1h-2v1h-2v1h-3v1h-6v-1H8v-1H6v-1H4v-1H3v-1H2v-1h1V9h1V8h2V7h2V6h3Z"/>
      <!-- Gray iris, black pupil, and square highlight. -->
      <path fill="#111" d="M11 6h6v1h2v2h1v3h-1v2h-2v1h-6v-1H9v-2H8V9h1V7h2Z"/>
      <path fill="#888" d="M11 7h6v1h1v1h1v3h-1v1h-1v1h-6v-1h-1v-1H9V9h1V8h1Z"/>
      <path fill="#444" d="M10 9h1v1h-1ZM11 12h1v1h-1ZM17 11h1v1h-1Z"/>
      <path fill="#111" d="M13 8h2v1h1v3h-1v1h-2v-1h-1V9h1Z"/>
      <path fill="#fff" d="M12 8h2v2h-2Z"/>
    </g>
    <g class="closed" fill="#111">
      <path d="M2 10h3v1h4v1h10v-1h4v-1h3v1h-2v1h-4v1H8v-1H4v-1H2Z"/>
      <path d="M5 12h1v2H5ZM9 13h1v2H9ZM14 13h1v3h-1ZM18 13h1v2h-1ZM22 12h1v2h-1Z"/>
    </g>
  </g>
</svg>
