<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hiromichiの写真。日々の景色や、撮った写真をまとめています。">
  <link rel="icon" type="image/svg+xml" href="/image/icon.svg">
  <title>Photos — hrmc.ngs.computer</title>
  <link rel="stylesheet" href="/src/css/style.css">
  <link rel="stylesheet" href="/src/css/appearance.css?v=2026-11-18-1">
  <link rel="stylesheet" href="/src/css/photos.css?v=2026-11-18-1">
  <link rel="stylesheet" href="/src/css/macos.css?v=2026-11-17-1">
  <link rel="stylesheet" href="/src/css/catalog.css?v=2026-11-18-38">
  <script src="/src/js/appearance.js?v=2026-11-18-5"></script>
  <script src="/src/js/theme.js?v=2026-09-09-1"></script>
  <script src="/src/js/photo-viewer.js?v=2026-09-05-3" defer></script>
  <script src="/src/js/photos.js?v=2026-09-05-8" defer></script>
</head>
<body class="catalog-home photos-body">
  <header class="mac-menu">
    <a class="mac-brand" href="/">hrmcngs</a>
    <div class="mac-appearance-controls">
      <select id="mac-appearance" aria-label="表示モード">
        <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
      </select>
    </div>
    <details class="film-menu">
      <summary aria-label="メニューを開く">
        <span class="menu-reel" aria-hidden="true"><span class="roll-cylinder">
          <span class="roll-face" style="--face:0"></span><span class="roll-face" style="--face:1"></span>
          <span class="roll-face" style="--face:2"></span><span class="roll-face" style="--face:3"></span>
          <span class="roll-face" style="--face:4"></span><span class="roll-face" style="--face:5"></span>
          <span class="roll-face" style="--face:6"></span><span class="roll-face" style="--face:7"></span>
          <span class="roll-face" style="--face:8"></span><span class="roll-face" style="--face:9"></span>
          <span class="roll-face" style="--face:10"></span><span class="roll-face" style="--face:11"></span>
        </span></span>
        <span class="reel-label">MENU</span>
      </summary>
      <div class="film-window"><div class="film-panel">
        <p class="film-caption" aria-hidden="true">HRMCNGS / NAVIGATION</p>
        <nav aria-label="メインメニュー">
          <a href="/">Home</a><a href="/works/">Works</a><a href="/about/">About</a><a href="/photos/">Photos</a>
        </nav>
      </div></div>
    </details>
  </header>
  <main class="section photos-page">
    <div class="container">
      <header class="photos-header">
        <h1 class="section-title in-view">Photos</h1>
        <p>日々の景色や、撮った写真をまとめています。</p>
        <p>写真をクリックして拡大。ホイール・ピンチでズームできます。</p>
      </header>
      <div class="photo-categories" role="group" aria-label="写真のカテゴリー">
        <button type="button" data-photo-category="all" aria-pressed="true" aria-controls="photos-grid">all</button>
        <button type="button" data-photo-category="scenery" aria-pressed="false" aria-controls="photos-grid">YOLO</button>
        <button type="button" data-photo-category="pebkac" aria-pressed="false" aria-controls="photos-grid">P.E.B.K.A.C.</button>
        <button type="button" data-photo-category="food" aria-pressed="false" aria-controls="photos-grid">NOM NOM</button>
      </div>
      <p id="photos-status" class="photos-status" role="status">写真を読み込み中…</p>
      <div id="photos-grid" class="photos-grid"></div>
      <noscript><p>写真を表示するにはJavaScriptを有効にしてください。</p></noscript>
    </div>
  </main>
  <dialog id="photo-viewer" class="photo-viewer" aria-label="写真ビューアー">
    <div class="viewer-toolbar">
      <span class="viewer-counter" aria-live="polite"></span>
      <div class="viewer-tools">
        <button type="button" data-action="out" aria-label="縮小">−</button>
        <button type="button" data-action="reset" aria-label="ズームをリセット">100%</button>
        <button type="button" data-action="in" aria-label="拡大">＋</button>
        <a class="viewer-original" target="_blank" rel="noopener noreferrer">元画像 ↗</a>
        <button type="button" data-action="close" aria-label="閉じる" autofocus>×</button>
      </div>
    </div>
    <div class="viewer-stage"><img alt="" draggable="false"></div>
    <div class="viewer-footer">
      <button type="button" data-action="prev" aria-label="前の写真">←</button>
      <p class="viewer-caption" aria-live="polite"></p>
      <button type="button" data-action="next" aria-label="次の写真">→</button>
    </div>
  </dialog>
  <script src="/src/js/film-menu.js?v=2026-11-17-1"></script>
</body>
</html>
